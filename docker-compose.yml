services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/jobs.db
    volumes:
      - jobs-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  jobs-data:
