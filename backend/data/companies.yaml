# Google for Jobs (LinkedIn / Indeed / Glassdoor / careers sites) via JSearch. Needs JSEARCH_API_KEY.
# Each entry is one saved search; the free plan (200 requests/month) fits ~2 searches every 8 hours.
- name: 'Google Jobs: entry-level data analyst'
  ats: jsearch
  slug: query=entry level data analyst jobs in USA&date_posted=today
- name: 'Google Jobs: entry-level software engineer'
  ats: jsearch
  slug: query=entry level software engineer jobs in USA&date_posted=today

